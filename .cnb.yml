# CNB 流水线配置
# 1. Git Sync：每次 push 到 main 后，自动将代码同步到 GitHub（h1s97x/readany）
#    使用官方 tencentcom/git-sync 插件 + sync_mode: rebase（Rebase 模式），
#    HTTPS + Access Token 认证。参考 https://cnb.cool/cnb/plugins/tencentcom/git-sync
#    敏感信息（GITHUB_USERNAME / GITHUB_TOKEN）存放在密钥仓库 secret-env，通过 imports 引用。
# 2. 手动触发（Web Trigger）：从 GitHub 拉取最新提交到 CNB（GitHub → CNB）
#    使用官方插件 sync_mode: pull，按钮见 .cnb/web_trigger.yml，事件挂靠在 $ 兜底分支下。
# 3. Issue / PR 自动分配处理人 / 审查人：创建后自动将处理人、审查人设置为仓库维护者。
#
# 说明：readany 是 Tauri 多平台桌面应用（macOS/Windows/Linux），其发布构建依赖各平台
#       独立 runner（见 .github/workflows/release.yml），无法在 CNB Linux runner 上复现，
#       故不在 CNB 侧做 tag 发布，发布统一走 GitHub Actions。
# 注意：不要用 `.` 开头的 key 存引用源（如 `.maintainer`）——CNB 会把以 `.` 开头的 key
#       当作 !reference 引用源，Schema 强制其为 array/object，字符串会触发 Schema 校验失败、
#       导致整个 .cnb.yml 无效。维护者直接内联，换维护者时统一改下方两处（issue / pr assignee）。

main:
  push:
    - name: sync-to-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/readany.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            branch: main
            push_tags: true
            # Rebase 模式：保留 GitHub 仓库特有的平台文件（如 .github/workflows/*.yml），
            # 同时避免无条件 force 覆盖 GitHub 远端的新提交。
            sync_mode: rebase

  # PR 创建后自动分配处理人和审查人
  # 使用 git:reviewer 内置任务（无需脚本、自动注入鉴权）。
  # 使用 pull_request 事件：会 checkout 预合并后的代码（含 PR 分支修改），
  # 而不是 pull_request.target（只 checkout 目标分支 main 的代码）。
  #   处理人：type: add-assignee
  #   审查人：type: add-reviewer-from-repo-members（从仓库成员中随机选一名评审人）
  pull_request:
    - name: auto-assign-pr-owner
      env:
        PR_REVIEWER: h1s97x
      stages:
        - name: assign pr to owner
          type: git:reviewer
          options:
            type: add-assignee
            reviewers: ${PR_REVIEWER}
        - name: add pr reviewer
          type: git:reviewer
          options:
            type: add-reviewer-from-repo-members

# 兜底分支：web_trigger / issue.* / tag_push 等事件
$:
  # 手动触发：从 GitHub 拉取（GitHub → CNB，新增）
  # 使用官方 tencentcom/git-sync 插件 + sync_mode: pull（Pull 模式），
  # 参考 https://cnb.cool/cnb/plugins/tencentcom/git-sync
  web_trigger_pull_from_github:
    - name: web-trigger-pull-from-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: pull from github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/readany.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            sync_mode: pull

  # Issue 创建后自动分配处理人
  # 使用官方 cnbcool/cnb-cli 插件（CNB OpenAPI 命令行工具），一行命令完成分配：
  #   - 流水线自动注入 CNB_TOKEN，无需手写鉴权
  #   - issue.open 事件自动注入 CNB_REPO_SLUG / CNB_ISSUE_IID，cnb 会识别快捷上下文
  #   参考 https://cnb.cool/cnb/plugins/cnbcool/cnb-cli
  issue.open:
    - name: auto-assign-issue-owner
      env:
        ISSUE_ASSIGNEE: h1s97x
      stages:
        - name: assign issue to owner
          image: cnbcool/cnb-cli
          script: |
            set -e
            cnb issues add-assignees --assignees $ISSUE_ASSIGNEE
